name: SDK Probe

on:
  workflow_dispatch:
  push:
    paths:
      - scripts/probe-patterns.txt
      - scripts/sdk-probe.sh
      - .github/workflows/sdk-probe.yml

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-26]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Select newest Xcode
        run: |
          ls -d /Applications/Xcode*.app
          sw_vers
          XCODE=$(ls -d /Applications/Xcode_*.app | grep -v -i beta | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
      - name: Probe
        run: scripts/sdk-probe.sh
